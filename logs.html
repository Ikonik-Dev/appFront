<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Collecteur de Logs - RNCP DWWM 2023</title>
    <style>
      body {
        font-family: "Courier New", monospace;
        padding: 1rem;
        background: #0a0a0a;
        color: #00ff00;
        margin: 0;
      }
      .header {
        background: #1a1a1a;
        padding: 1rem;
        margin-bottom: 1rem;
        border-radius: 5px;
        border-left: 4px solid #00ff00;
      }
      .log-container {
        background: #111;
        border: 1px solid #333;
        border-radius: 5px;
        height: 70vh;
        overflow-y: auto;
        padding: 1rem;
        font-size: 12px;
        line-height: 1.4;
      }
      .log-entry {
        margin-bottom: 0.5rem;
        padding: 0.25rem;
        border-radius: 3px;
      }
      .log-info {
        color: #00bfff;
      }
      .log-success {
        color: #00ff00;
      }
      .log-warn {
        color: #ffaa00;
        background: rgba(255, 170, 0, 0.1);
      }
      .log-error {
        color: #ff4444;
        background: rgba(255, 68, 68, 0.1);
      }
      .log-debug {
        color: #888;
      }
      .timestamp {
        color: #666;
        font-size: 10px;
      }
      .controls {
        margin: 1rem 0;
        display: flex;
        gap: 1rem;
        flex-wrap: wrap;
      }
      .btn {
        padding: 0.5rem 1rem;
        border: 1px solid #333;
        background: #222;
        color: #fff;
        border-radius: 3px;
        cursor: pointer;
        font-family: inherit;
        font-size: 12px;
      }
      .btn:hover {
        background: #333;
      }
      .btn.active {
        background: #00ff00;
        color: #000;
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 1rem;
        margin: 1rem 0;
      }
      .stat-card {
        background: #1a1a1a;
        padding: 1rem;
        border-radius: 5px;
        border-left: 4px solid #00ff00;
        text-align: center;
      }
      .stat-value {
        font-size: 24px;
        font-weight: bold;
        color: #00ff00;
      }
      .stat-label {
        color: #888;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <h1>🔍 Collecteur de Logs - Application RNCP DWWM 2023</h1>
      <p>Monitoring en temps réel des logs et diagnostics</p>
    </div>

    <div class="stats" id="stats">
      <div class="stat-card">
        <div class="stat-value" id="total-logs">0</div>
        <div class="stat-label">Total Logs</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="error-count">0</div>
        <div class="stat-label">Erreurs</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="warn-count">0</div>
        <div class="stat-label">Avertissements</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="success-count">0</div>
        <div class="stat-label">Succès</div>
      </div>
    </div>

    <div class="controls">
      <button class="btn active" onclick="toggleFilter('all')" id="filter-all">
        Tous
      </button>
      <button class="btn" onclick="toggleFilter('error')" id="filter-error">
        Erreurs
      </button>
      <button class="btn" onclick="toggleFilter('warn')" id="filter-warn">
        Avertissements
      </button>
      <button class="btn" onclick="toggleFilter('success')" id="filter-success">
        Succès
      </button>
      <button class="btn" onclick="toggleFilter('info')" id="filter-info">
        Info
      </button>
      <button class="btn" onclick="toggleFilter('debug')" id="filter-debug">
        Debug
      </button>
      <button class="btn" onclick="clearLogs()">🗑️ Vider</button>
      <button class="btn" onclick="exportLogs()">💾 Exporter</button>
      <button class="btn" onclick="runDiagnostic()">🔬 Diagnostic</button>
    </div>

    <div class="log-container" id="log-container"></div>

    <script>
      let logs = [];
      let currentFilter = "all";
      let stats = {
        total: 0,
        error: 0,
        warn: 0,
        success: 0,
        info: 0,
        debug: 0,
      };

      // Intercepter les logs de la console
      const originalConsole = {
        log: console.log,
        error: console.error,
        warn: console.warn,
        info: console.info,
        debug: console.debug,
      };

      function addLog(level, message, ...args) {
        const timestamp = new Date().toISOString();
        const logEntry = {
          level,
          message:
            typeof message === "string" ? message : JSON.stringify(message),
          args: args.map((arg) =>
            typeof arg === "object" ? JSON.stringify(arg) : String(arg)
          ),
          timestamp,
          id: Date.now() + Math.random(),
        };

        logs.push(logEntry);
        stats.total++;
        stats[level]++;

        updateStats();
        if (currentFilter === "all" || currentFilter === level) {
          displayLog(logEntry);
        }

        // Appeler la console originale
        originalConsole[level](message, ...args);
      }

      // Remplacer les méthodes de console
      console.log = (...args) => addLog("info", ...args);
      console.error = (...args) => addLog("error", ...args);
      console.warn = (...args) => addLog("warn", ...args);
      console.info = (...args) => addLog("info", ...args);
      console.debug = (...args) => addLog("debug", ...args);

      function displayLog(logEntry) {
        const container = document.getElementById("log-container");
        const div = document.createElement("div");
        div.className = `log-entry log-${logEntry.level}`;

        const timeStr = new Date(logEntry.timestamp).toLocaleTimeString();
        const argsStr =
          logEntry.args.length > 0 ? " " + logEntry.args.join(" ") : "";

        div.innerHTML = `
                <span class="timestamp">[${timeStr}]</span> 
                <strong>[${logEntry.level.toUpperCase()}]</strong> 
                ${logEntry.message}${argsStr}
            `;

        container.appendChild(div);
        container.scrollTop = container.scrollHeight;
      }

      function updateStats() {
        document.getElementById("total-logs").textContent = stats.total;
        document.getElementById("error-count").textContent = stats.error;
        document.getElementById("warn-count").textContent = stats.warn;
        document.getElementById("success-count").textContent =
          stats.success + stats.info;
      }

      function toggleFilter(filter) {
        // Mettre à jour les boutons
        document
          .querySelectorAll(".btn")
          .forEach((btn) => btn.classList.remove("active"));
        document.getElementById(`filter-${filter}`).classList.add("active");

        currentFilter = filter;
        refreshDisplay();
      }

      function refreshDisplay() {
        const container = document.getElementById("log-container");
        container.innerHTML = "";

        logs.forEach((log) => {
          if (currentFilter === "all" || currentFilter === log.level) {
            displayLog(log);
          }
        });
      }

      function clearLogs() {
        logs = [];
        stats = {
          total: 0,
          error: 0,
          warn: 0,
          success: 0,
          info: 0,
          debug: 0,
        };
        document.getElementById("log-container").innerHTML = "";
        updateStats();
      }

      function exportLogs() {
        const logText = logs
          .map((log) => {
            const time = new Date(log.timestamp).toLocaleString();
            const argsStr = log.args.length > 0 ? " " + log.args.join(" ") : "";
            return `[${time}] [${log.level.toUpperCase()}] ${
              log.message
            }${argsStr}`;
          })
          .join("\n");

        const blob = new Blob([logText], { type: "text/plain" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `app-logs-${new Date().toISOString().slice(0, 19)}.txt`;
        a.click();
        URL.revokeObjectURL(url);
      }

      async function runDiagnostic() {
        console.log("🔬 DIAGNOSTIC STARTED");
        console.log("=".repeat(50));

        // Test 1: Vérifier les scripts chargés
        const scripts = [
          "APP_CONFIG",
          "APP_STATE",
          "DEBUG",
          "DOMUtils",
          "RouterManager",
          "Navigation",
          "AnimationUtils",
        ];
        console.log("📦 Scripts Status:");
        scripts.forEach((script) => {
          const status = typeof window[script] !== "undefined" ? "✅" : "❌";
          console.log(`  ${status} ${script}`);
        });

        // Test 2: État de l'application
        if (typeof window.app !== "undefined") {
          console.log("🚀 Application Status:");
          console.log(`  ✅ App initialized: ${window.app.isReady()}`);
          console.log(`  📊 Version: ${window.app.getVersion()}`);

          if (window.app.getPerformanceInfo) {
            const perfInfo = window.app.getPerformanceInfo();
            console.log("  📈 Performance Info:", perfInfo);
          }
        } else {
          console.error("❌ Application not found");
        }

        // Test 3: Router
        if (
          typeof window.router !== "undefined" ||
          typeof window.RouterInstance !== "undefined"
        ) {
          const router = window.router || window.RouterInstance;
          console.log("🧭 Router Status:");

          if (router.getCacheStats) {
            const cacheStats = router.getCacheStats();
            console.log(`  📊 Cache Stats:`, cacheStats);
          }

          if (router.currentPage) {
            console.log(`  📄 Current Page: ${router.currentPage}`);
          }
        } else {
          console.warn("⚠️ Router not found");
        }

        // Test 4: Animations
        if (
          typeof AnimationUtils !== "undefined" &&
          AnimationUtils.getAnimationStats
        ) {
          const animStats = AnimationUtils.getAnimationStats();
          console.log("🎬 Animation Stats:", animStats);
        }

        // Test 5: DOM
        console.log("🌐 DOM Status:");
        console.log(
          `  📱 Viewport: ${window.innerWidth}x${window.innerHeight}`
        );
        console.log(`  🎯 Focus: ${document.activeElement.tagName}`);
        console.log(`  📊 Elements: ${document.querySelectorAll("*").length}`);

        // Test 6: Network
        console.log("🌍 Network Status:");
        console.log(`  📶 Online: ${navigator.onLine}`);
        console.log(`  🌐 User Agent: ${navigator.userAgent}`);

        console.log("=".repeat(50));
        console.log("🔬 DIAGNOSTIC COMPLETED");
      }

      // Logs de démarrage
      console.log("🔍 Log Collector initialized");
      console.log("📊 Monitoring console output...");

      // Charger les scripts de l'application
      const scripts = [
        "./assets/scripts/config.js",
        "./assets/scripts/utils.js",
        "./assets/scripts/components.js",
        "./assets/scripts/router.js",
        "./assets/scripts/app.js",
      ];

      let loadedScripts = 0;
      scripts.forEach((src, index) => {
        const script = document.createElement("script");
        script.src = src;
        script.onload = () => {
          loadedScripts++;
          console.log(`✅ Script loaded: ${src}`);

          if (loadedScripts === scripts.length) {
            console.log("🚀 All scripts loaded, starting application...");

            setTimeout(() => {
              if (typeof ApplicationBootstrap !== "undefined") {
                ApplicationBootstrap.start()
                  .then(() => {
                    console.log("✅ Application started successfully!");
                    setTimeout(runDiagnostic, 1000);
                  })
                  .catch((error) => {
                    console.error("❌ Application startup failed:", error);
                  });
              }
            }, 500);
          }
        };
        script.onerror = () => {
          console.error(`❌ Failed to load script: ${src}`);
        };
        document.head.appendChild(script);
      });

      // Auto-refresh des stats
      setInterval(updateStats, 1000);
    </script>
  </body>
</html>
